<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Instagram Login</title>
  <link rel="stylesheet" href="styles.css">
  <style>
  body {
    margin: 0;
    font-family: Arial, sans-serif;
    background-color: #fafafa;
  }
  
  .login-container {
    width: 100%;
    height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
  }
  
  .login-box {
    width: 350px;
    padding: 40px;
    background-color: #fff;
    border: 1px solid #dbdbdb;
    text-align: center;
    margin-bottom: 10px;
  }
  
  img{
    margin-bottom: 40px;
  }
  
  .input-field {
    width: 100%;
    padding: 10px;
    margin-bottom: 8px;
    border: 1px solid #dbdbdb;
    border-radius: 3px;
    font-size: 14px;
  }
  
  .login-btn {
    width: 100%;
    padding: 10px;
    background-color: #0095f6;
    color: #fff;
    border: none;
    border-radius: 3px;
    font-weight: bold;
    margin-top: 10px;
    cursor: pointer;
  }
  
  .divider {
    display: flex;
    align-items: center;
    margin: 20px 0;
    color: #8e8e8e;
    font-size: 13px;
  }
  
  .divider .line {
    flex: 1;
    height: 1px;
    background-color: #dbdbdb;
  }
  
  .divider span {
    margin: 0 18px;
  }
  
  .facebook-login {
    color: #385185;
    font-weight: bold;
    text-decoration: none;
    font-size: 14px;
  }
  
  .forgot-password {
    display: block;
    margin-top: 12px;
    font-size: 12px;
    color: #00376b;
    text-decoration: none;
  }
  
  .signup-box {
    width: 350px;
    padding: 20px;
    background-color: #fff;
    border: 1px solid #dbdbdb;
    text-align: center;
    font-size: 14px;
  }
  
  .signup-box a {
    color: #0095f6;
    text-decoration: none;
    font-weight: bold;
  }
</style>
</head>
<body>
  <div class="login-container">
    <div class="login-box">
        <img src="./instagram/images/Screenshot 2025-04-23 at 10-41-39 Instagram.png" alt="">
      <form>
        <input type="text" placeholder="Phone number, username, or email" class="input-field">
        <input type="password" placeholder="Password" class="input-field">
        <button type="submit" class="login-btn">Log In</button>
        <div class="divider">
          <div class="line"></div>
          <span>OR</span>
          <div class="line"></div>
        </div>
        <a href="#" class="facebook-login">Log in with Facebook</a>
        <a href="#" class="forgot-password">Forgot password?</a>
      </form>
    </div>
    <div class="signup-box">
      <p>Don't have an account? <a href="#">Sign up</a></p>
    </div>
  </div>
</body>
</html>
