<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Instagram-login or signup</title>
    <style>
        .container {
            height: 350px;
            width: 600px;
            align-items: center;
            text-align: center;
            justify-content: center;
           margin: 30px auto;
        }
        img {
            position: relative;
            margin-top: 100px;
            height: 60px;
            margin-bottom: 45px;

        }
        .facebook {
            height: 30px;
            width: 30px;
        }
        .divider {
            display: flex;
            align-items: center;
            text-align: center;
            margin: 20px 40px;
        }
        .line { 
            height: 1.1px;
            flex: 1;
            background-color: #dbd8d8;
        }
        .or {  
            padding: 0 18px;
            color: #8e8e8e;
            font-size: 13px;
            font-weight: 600;
        }
        input{
            margin-top: 20px;
            position: relative; 
            width: 330px;
            height:45px;
            border: 1.5px solid lightgrey;
            padding: 0 14px;
            border-radius: 5px;
            background-color: #fafafa;
            margin-top: 0.5rem;
        }
        button{
            background-color: rgb(74, 186, 230);
            height: 40px;
            width: 360px;
            border-radius: 10px;
            margin-top: 20px;
            margin-bottom: 20px;
            color: white;
            font-size: 20px;
        }
        .facebook-image {
            height: 10px;
            width: 50px;
            align-items: center;
            text-align: center;
            justify-content: center;
           margin: 30px auto;
        }
    </style>
</head>
<body>
    <div class="container">
    <img src="./instagram/images/Screenshot 2025-04-23 at 10-41-39 Instagram.png" alt="">
    <form action="#">
        <input type="text" placeholder="Phone number, username, email." />
        <input type="password" placeholder="Password" />

        <button class="login">Log in</button>
        <div class="divider">
            <div class="line"></div>
            <div class="or">OR</div>
            <div class="line"></div>
        </div>
                </div>
    </form>



</div>
<div class="facebook-image">
    <img src="./facebook/images/facebook-logo_1080029-107.avif" alt="" class="facebook">
    </div>
</body>
</html>
