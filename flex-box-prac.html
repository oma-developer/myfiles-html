<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Flex Box</title>
    <style>
        .container {
            width: 340px;
            height: 100px;
            background-color: rgb(52, 164, 234);
            display: flex;
            flex-direction: row;
            align-items: center;
            border: 1px solid black;

        }
        .box {
            background-color: #b3d1ea;
            width: 60px;
            height: 80px;
            justify-content: center;
            text-align: center;
            font-size: 50px;
            align-items: center;
            justify-items: center;
            margin: 7px;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            
        }
    </style>
</head>
<body>
 <div class="container">
    <div class="box">1</div>
    <div class="box">2</div>
    <div class="box">3</div>
 </div>   
</body>
</html>
