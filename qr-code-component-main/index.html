<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>QR Code Component</title>
  <style>
    * {
  box-sizing: border-box;
  margin: 0px;
  padding: 0px;
  font-family: 'Outfit', sans-serif;
}
.container{
  background-color: lightblue;
  height: 600px;
  width: 1200px;
  margin: 0 auto;
  box-shadow: 5px 5px 5px rgba(0, 0, 0, 0.2);
}
.wrapper {
  padding-top: 100px;
  display: flex;
  justify-content: center;
}

.card {
  background-color: white;
  border-radius: 20px;
  padding: 20px;
  width: 320px;
  text-align: center;
  box-shadow: 0px 10px 20px rgba(0, 0, 0, 0.1);
}

.image-box img {
  width: 280px;
  height: auto;
  border-radius: 10px;
}

.text-box {
  margin-top: 15px;
}

.heading {
  font-size: 20px;
  margin-bottom: 15px;
  color: hsl(218, 44%, 22%);
}

.description {
  font-size: 15px;
  color: hsl(220, 15%, 55%);
}
  </style>
</head>
<body>
  <div class="container">
  <div class="wrapper">
    <div class="card">
      <div class="image-box">
        <img src="images/image-qr-code.png" alt="QR Code">
      </div>
      <div class="text-box">
        <div class="heading">
          Improve your front-end skills by building projects
        </div>
        <div class="description">
          Scan the QR code to visit Frontend Mentor and take your coding skills to the next level
        </div>
      </div>
    </div>
  </div>
</div>

</body>
</html>
